<!doctype html><html><head><meta charset="utf-8"><title>Data Engineer at Acme</title>
<!-- A page whose CSS (here, or another extension's) is hostile to anything placed
     in it: transparent divs, huge text, buttons stripped of their styling, and
     the very class names the run panel used to use. The run panel must look the
     same here as anywhere else. -->
<style>
div{background:transparent!important;font-size:28px!important;line-height:1.1!important}
button{all:unset!important;font-size:26px!important;color:#f0f!important}
.uc-act,.uc-sp,.uc-title,#ua-ctrl-card,.uc-count{background:transparent!important;border:3px solid #f0f!important;font-size:30px!important;width:auto!important}
body{font-family:serif;background:#fff;max-width:720px;margin:20px auto}
</style></head><body>
<h1>Data Engineer</h1><div class="company">Acme Corp</div>
<form id="application_form" onsubmit="return false">
  <p><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></p>
  <p><label for="email">Email *</label><input id="email" name="email" type="email" required></p>
</form>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><title>Software Engineer at Acme</title><style>body{font-family:sans-serif;max-width:720px;margin:20px auto}.f{margin:12px 0}label{display:block;font-weight:600}input[type=text],input[type=email],input[type=tel],select{width:100%;padding:6px}</style></head><body>
<!-- Knockout questions from the 27-10-2026 ATS pack (Knockout_Questions_Examples), one of each kind. --><h1>Software Engineer</h1><div class="company">Acme Corp</div><div>Location: Dublin, Ireland</div>
<form id="application_form" novalidate onsubmit="return window.__validate(event)">
<div class="f"><label for="first_name">First Name *</label><input type="text" id="first_name" name="first_name" required></div>
<div class="f"><label for="last_name">Last Name *</label><input type="text" id="last_name" name="last_name" required></div>
<div class="f"><label for="email">Email *</label><input type="text" id="email" name="email" required></div>
<div class="f"><label for="phone">Phone *</label><input type="text" id="phone" name="phone" required></div>
<div class="f"><label for="auth_here">Are you legally authorised to work in the country where this position is located? *</label><select id="auth_here" name="auth_here" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="spons">Will you now or in the future require sponsorship for an employment visa? *</label><select id="spons" name="spons" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="eu_docs">Do you have documents entitling you to work in the European Union (valid work permits)? *</label><select id="eu_docs" name="eu_docs" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="us_auth">Are you authorised to work in the United States? *</label><select id="us_auth" name="us_auth" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="visa_req">Visa / work permit required? *</label><select id="visa_req" name="visa_req" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="embargo">Are you a citizen, national or permanent resident of Cuba, Iran, North Korea, Syria or Crimea? *</label><select id="embargo" name="embargo" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="reloc">Would you consider relocating for this role? *</label><select id="reloc" name="reloc" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="office2">We require two office days a week in Dublin. Is this doable for you? *</label><select id="office2" name="office2" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="reloc_open">Are you open to relocation? *</label><select id="reloc_open" name="reloc_open" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="four_plus">Do you have 4+ years of experience as a full-time engineer? *</label><select id="four_plus" name="four_plus" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="fintech">Do you have experience working with fintech? *</label><select id="fintech" name="fintech" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="ai_tools">Do you have experience using AI tools to produce models, reports or scripts? *</label><select id="ai_tools" name="ai_tools" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="calls">Do you feel comfortable communicating with teammates and clients via phone and video calls daily? *</label><select id="calls" name="calls" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="b2">Do you speak English at a minimum B2 level? *</label><select id="b2" name="b2" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="prev_emp">Have you previously worked for Acme as an employee or contractor? *</label><select id="prev_emp" name="prev_emp" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="noncompete">Have you entered into any restrictive covenant, non-compete or non-disclosure agreement that could restrict you? *</label><select id="noncompete" name="noncompete" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="related">Are you related to anyone who can influence or sign commercial or government contracts with Acme? *</label><select id="related" name="related" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="usgov">In the last five years, have you been an employee of the US Federal Government or a state or local government? *</label><select id="usgov" name="usgov" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="pwc">Are you currently employed by, or have you been employed by, PwC? *</label><select id="pwc" name="pwc" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="earlycareer">Are you a graduate of the company's early-careers programme? *</label><select id="earlycareer" name="earlycareer" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="age18">Are you at least 18 years of age? *</label><select id="age18" name="age18" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="bgcheck">Any offer is contingent on a background check. Do you acknowledge? *</label><select id="bgcheck" name="bgcheck" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="true_complete">I acknowledge that my answers are true and complete. *</label><select id="true_complete" name="true_complete" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="travel_open">Are you open to travel? *</label><select id="travel_open" name="travel_open" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="adjust">Do you require any adjustments for the interview process? *</label><select id="adjust" name="adjust" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="sms">May we text you? *</label><select id="sms" name="sms" required><option value="">Select...</option><option>Yes</option><option>No</option></select></div>
<div class="f"><label for="eng_level">Please indicate your English proficiency *</label><select id="eng_level" name="eng_level" required><option value="">Select...</option><option value="Basic A1-A2">Basic A1-A2</option><option value="Intermediate B1">Intermediate B1</option><option value="Upper-Intermediate B2">Upper-Intermediate B2</option><option value="Advanced C1">Advanced C1</option><option value="Fluent C2">Fluent C2</option></select></div>
<div class="f"><label for="currency">Salary currency *</label><select id="currency" name="currency" required><option value="">Select...</option><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="PLN">PLN</option></select></div>
<div class="f"><label for="gross">Gross or net? *</label><select id="gross" name="gross" required><option value="">Select...</option><option value="Gross">Gross</option><option value="Net">Net</option></select></div>
<div class="f"><label for="period">Monthly or yearly? *</label><select id="period" name="period" required><option value="">Select...</option><option value="Monthly">Monthly</option><option value="Yearly">Yearly</option></select></div>
<div class="f"><label for="residence">Please specify the country where you reside *</label><select id="residence" name="residence" required><option value="">Select...</option><option value="Poland">Poland</option><option value="Ukraine">Ukraine</option><option value="Ireland">Ireland</option><option value="Germany">Germany</option><option value="Other">Other</option></select></div>
<div class="f"><label for="scale">On a scale of 1 to 4, how experienced are you with application programming? *</label><select id="scale" name="scale" required><option value="">Select...</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
<div class="f"><label for="how_heard">How did you hear about us? *</label><select id="how_heard" name="how_heard" required><option value="">Select...</option><option value="Online Job Board">Online Job Board</option><option value="Company Website">Company Website</option><option value="Friend or Family Member">Friend or Family Member</option><option value="Current Employee">Current Employee</option><option value="LinkedIn">LinkedIn</option><option value="Other">Other</option></select></div>
<div class="f"><label for="gender">Gender *</label><select id="gender" name="gender" required><option value="">Select...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Prefer not to self-identify">Prefer not to self-identify</option></select></div>
<div class="f"><label for="veteran">Veteran status *</label><select id="veteran" name="veteran" required><option value="">Select...</option><option value="I am a protected veteran">I am a protected veteran</option><option value="I am not a protected veteran">I am not a protected veteran</option><option value="I prefer not to answer">I prefer not to answer</option></select></div>
<div class="f"><label for="cur_emp_by">Are you currently employed by (None of the above / SAP company / SAP partner)? *</label><select id="cur_emp_by" name="cur_emp_by" required><option value="">Select...</option><option value="None of the above">None of the above</option><option value="SAP company">SAP company</option><option value="SAP partner">SAP partner</option></select></div>
<div class="f"><label for="visa_status">Could you confirm your current visa status in Ireland and whether you would require sponsorship? *</label><input type="text" id="visa_status" name="visa_status" required></div>
<div class="f"><label for="reside">Which country do you currently reside in? *</label><input type="text" id="reside" name="reside" required></div>
<div class="f"><label for="work_from">Which country do you intend to work from? *</label><input type="text" id="work_from" name="work_from" required></div>
<div class="f"><label for="pref_loc">Preferred location? *</label><input type="text" id="pref_loc" name="pref_loc" required></div>
<div class="f"><label for="travel_pct">What percentage of travel are you open to? *</label><input type="text" id="travel_pct" name="travel_pct" required></div>
<div class="f"><label for="years">Years of relevant experience? *</label><input type="text" id="years" name="years" required></div>
<div class="f"><label for="salary">What are your salary expectations for this role? *</label><input type="text" id="salary" name="salary" required></div>
<div class="f"><label for="cur_salary">What is your current salary? *</label><input type="text" id="cur_salary" name="cur_salary" required></div>
<div class="f"><label for="notice">What is your notice period? *</label><input type="text" id="notice" name="notice" required></div>
<div class="f"><label for="start">When would you be available to start? *</label><input type="text" id="start" name="start" required></div>
<div class="f"><label for="signature">Please type your full name as your electronic signature *</label><input type="text" id="signature" name="signature" required></div>
<div class="f"><label for="ai_which">Which AI tools do you use? *</label><input type="text" id="ai_which" name="ai_which" required></div>
<div class="f"><label for="resume">Resume/CV *</label><input type="file" id="resume" name="resume" required></div><button type="submit" id="submit_app">Submit Application</button></form>
<script>window.__validate=(e)=>{e.preventDefault();const f=document.getElementById('application_form');const fd=new FormData(f);const out={};for(const [k,v] of fd.entries())out[k]=v instanceof File?(v.name?'FILE:'+v.name:''):v;if(!f.checkValidity()){console.log('BLOCKED invalid '+JSON.stringify(out));return false;}window.__submitted=out;console.log('SUBMITTED '+JSON.stringify(out));document.body.innerHTML='<h1>Thank you for applying!</h1><p>Your application has been submitted.</p>';return false;};</script></body></html>
